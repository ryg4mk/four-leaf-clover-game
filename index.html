<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#173b1c">
  <meta name="description" content="大量の実写風クローバーの中から、四つ葉のクローバーを1つだけ探す高難度タイムアタックゲーム。">
  <title>四つ葉のクローバーを探すゲーム</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="title-block">
        <h1>四つ葉のクローバーを探すゲーム</h1>
      </div>
      <div class="hud-numbers">
        <div class="meter"><span>TIME</span><strong id="timeValue">0.00</strong></div>
        <div class="meter"><span>BEST</span><strong id="bestValue">--.--</strong></div>
      </div>
    </header>

    <section id="fieldWrap" class="field-wrap" aria-label="クローバー畑">
      <canvas id="gameCanvas" width="540" height="820"></canvas>
      <div id="missLayer" class="miss-layer" aria-hidden="true"></div>
      <div id="foundMarker" class="found-marker hidden" aria-hidden="true"><span></span><span></span><b>FOUND!</b></div>
    </section>

    <section id="startScreen" class="overlay">
      <div class="panel">
        <h2>四つ葉を1つだけ探せ</h2>
        <p>大量の三つ葉に紛れた四つ葉のクローバーをタップしてください。位置は毎回ランダムです。</p>
        <button id="startButton" type="button">START</button>
      </div>
    </section>

    <section id="resultScreen" class="overlay hidden" aria-live="polite">
      <div class="panel result-panel">
        <p class="panel-kicker">FOUND!</p>
        <h2>四つ葉のクローバー発見</h2>
        <div class="result-main"><strong id="resultTime">0.00</strong><span>秒</span></div>
        <dl class="result-stats">
          <div><dt>タップ回数</dt><dd id="resultTaps">1回</dd></div>
          <div><dt>BEST</dt><dd id="resultBest">--.--秒</dd></div>
        </dl>
        <p id="recordText" class="record-text"></p>
        <button id="retryButton" type="button">もう一回</button>
      </div>
    </section>
  </main>
</body>
</html>
